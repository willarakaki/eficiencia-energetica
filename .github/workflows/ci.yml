name: Continuous Integration

on:
  pull_request:
  push:
    branches:
      - '*'

jobs:
  continuous-integration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Iniciar Servicos da Aplicacao (Docker)
        run: |
          docker compose up -d --build
          echo "Aguardando inicializacao dos servicos..."
          sleep 30

      - name: Build and test
        working-directory: testes-automatizados
        run: |
          mvn clean test
