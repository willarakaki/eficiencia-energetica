apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-eficiencia-energetica
  namespace: esg-production
  labels:
    app: eficiencia-energetica
    environment: production
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: eficiencia-energetica
  template:
    metadata:
      labels:
        app: eficiencia-energetica
        environment: production
    spec:
      containers:
        - name: app-container
          image: eficiencia-energetica:production
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config-prod
            - secretRef:
                name: app-secrets-prod
          resources:
            requests:
              memory: "512Mi"
              cpu: "300m"
            limits:
              memory: "1024Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
